<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 1.1</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

    <aside class="sidebar">
        <p class="sidebar-title">Nexus</p>
        <button class="new-conversation-button">New Conversation</button>
        <div class="conversations-box">

        </div>
        <button class="settings-button">Settings</button>
    </aside>

    <main class="main-area">
        <div class="llm-conversation-box">

            <div class="llm-input-box">
                <button class="upload-files">
                    <span class="material-symbols-outlined">
                        upload
                    </span>
                </button>
                <input type="search" class="text-input" placeholder="Ask anything">
                <button class="enable-internet-searching">
                    <span class="material-symbols-outlined">
                        travel_explore
                    </span>
                </button>
                <button class="voice-mode">
                    <span class="material-symbols-outlined">
                        graphic_eq
                    </span>
                </button>
            </div>
        </div>
    </main>

</body>
</html>
