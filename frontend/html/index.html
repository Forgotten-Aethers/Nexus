<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 1.1</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../../assets/images/Nexus-Sidebar-title-v1.0.0.svg" alt="Sidebar Header">
        </div>
        <button class="search-conversations-button">
            <span class="material-symbols-outlined">
                search
            </span>
        </button>
        <button>
            <span class="material-symbols-outlined">
                dock_to_right
            </span>
        </button>
        <button class="new-conversation-button">New Conversation</button>
        <div class="conversations-box">

        </div>
        <button class="settings-button">Settings</button>
    </aside>

    <main class="main-area">
        <div class="llm-conversation-box">
            <div class="llm-input-box">
                <input type="search" class="text-input" placeholder="Ask anything">
                <div class="buttons">
                    <button class="upload-files">
                        <span class="material-symbols-outlined">
                            upload
                        </span>
                    </button>
                    <button class="thinking-button">Thinking</button>
                    <button class="enable-internet-searching">
                        <span class="material-symbols-outlined">
                            travel_explore
                        </span>
                    </button>
                    <button class="voice-mode">
                        <span class="material-symbols-outlined">
                            graphic_eq
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
